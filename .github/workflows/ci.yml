name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage
        env:
          VITE_RAPID_API_ARTICLE_KEY: ${{ secrets.VITE_RAPID_API_ARTICLE_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_RAPID_API_ARTICLE_KEY: ${{ secrets.VITE_RAPID_API_ARTICLE_KEY }}
